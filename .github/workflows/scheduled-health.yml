name: Scheduled health

on:
  schedule:
    # Mon + Thu 10:00 UTC (~6am US Eastern) — keeps CI green while laptop is off
    - cron: "0 10 * * 1,4"
  workflow_dispatch:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: API tests
        working-directory: services/api
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Production smoke (API + web auth gate)
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" -I https://aod-next.vercel.app/dashboard)
          test "$code" = "307" -o "$code" = "302" -o "$code" = "308"
          curl -sf https://associateondemand-api.fly.dev/health | grep -q '"status":"ok"'
