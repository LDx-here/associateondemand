services:
  postgres:
    image: postgres:16
    container_name: aod-postgres
    environment:
      POSTGRES_DB: aod
      POSTGRES_USER: aod
      POSTGRES_PASSWORD: aod
    ports:
      - "5432:5432"
    volumes:
      - aod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aod -d aod"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: aod-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: aod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - aod_qdrant_data:/qdrant/storage

  presidio:
    image: python:3.12-alpine
    container_name: aod-presidio-stub
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    ports:
      - "8080:8080"
    # Replace with real Presidio Analyzer + Anonymizer + LiteLLM in production.

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: aod-api
    environment:
      DATABASE_URL: postgresql+psycopg://aod:aod@postgres:5432/aod
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ALLOWED_ORIGINS: http://localhost:3000
      AOD_PII_TIER: "0"
      AOD_CONSTITUTION_DIR: /app/docs/constitution
      AOD_BRAIN_ROOT: /app/brain
      UPLOAD_DIR: /data/uploads
      PRESIDIO_HEALTH_URL: http://presidio:8080
      OCR_PROVIDER: tesseract
      APP_NAME: AssociateOnDemand API
    volumes:
      - aod_uploads:/data/uploads
      - ./brain:/app/brain
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      presidio:
        condition: service_started

volumes:
  aod_pg_data:
  aod_qdrant_data:
  aod_uploads:
