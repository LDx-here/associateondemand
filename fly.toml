# Fly.io stub for AssociateOnDemand API
# Run from repository root: fly launch && fly deploy
# Dockerfile context must be repo root (see services/api/Dockerfile COPY paths).

app = 'associateondemand-api'
primary_region = 'iad'

[build]
  dockerfile = 'services/api/Dockerfile'

[env]
  APP_NAME = 'AssociateOnDemand API'
  AOD_PII_TIER = '0'
  OCR_PROVIDER = 'tesseract'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
